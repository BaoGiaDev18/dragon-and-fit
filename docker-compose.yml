# Local PostgreSQL for development (production uses Neon).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dragonfit
      POSTGRES_PASSWORD: dragonfit
      POSTGRES_DB: dragonfit
    ports:
      - "5432:5432"
    volumes:
      - dragonfit-db:/var/lib/postgresql/data
volumes:
  dragonfit-db:
